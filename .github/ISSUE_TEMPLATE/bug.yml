name: Something is not working
description: A wrong number, an error, something that looks broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected and what you got. A screenshot helps (hide your e-mail and chat names if they show).
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Tandem version
      description: It is at the bottom of Settings.
      placeholder: "0.5.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
